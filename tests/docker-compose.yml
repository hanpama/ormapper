services:
  postgres:
    image: postgres:16-alpine
    container_name: ormapper-postgres
    environment:
      POSTGRES_DB: ormapper
      POSTGRES_USER: ormapper
      POSTGRES_PASSWORD: ormapper
    ports:
      - "17432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ormapper -d ormapper"]
      interval: 1s
      timeout: 5s
      retries: 30
