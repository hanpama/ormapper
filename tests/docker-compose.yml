services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agg
      POSTGRES_USER: agg
      POSTGRES_PASSWORD: agg
    ports:
      - "17432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agg -d agg"]
      interval: 1s
      timeout: 5s
      retries: 30
