name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ormapper
          POSTGRES_USER: ormapper
          POSTGRES_PASSWORD: ormapper
        ports:
          - 17432:5432
        options: >-
          --health-cmd "pg_isready -U ormapper -d ormapper"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Test root module
        run: go test ./...

      - name: Test contracts module
        working-directory: tests/contracts
        run: go test ./...

      - name: Test SQLite module
        working-directory: tests/sqlite
        run: go test ./...

      - name: Test PostgreSQL module
        working-directory: tests/postgres
        run: go test ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Lint root module
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run ./...

      - name: Lint contracts module
        working-directory: tests/contracts
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run ./...

      - name: Lint SQLite module
        working-directory: tests/sqlite
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run ./...

      - name: Lint PostgreSQL module
        working-directory: tests/postgres
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run ./...
